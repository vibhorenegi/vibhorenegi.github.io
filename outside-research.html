<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outside Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <h1 class="page-title">Outside Research</h1>
    <p class="page-sub">Life beyond the office</p>

    <section>
      <div class="lede" id="js-outside"></div>
    </section>
  </main>
</div>
<footer id="footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
  renderSidebar();
  renderTopbar('outside');
  renderFooter();
  document.getElementById('js-outside').innerHTML =
    DATA.outside_text
      .split(/\n\s*\n/)
      .map(p => `<p style="margin-bottom:20px;">${p.trim()}</p>`)
      .join('');
</script>
</body>
</html>
